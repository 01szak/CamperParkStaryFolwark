spring.application.name=camperparkdemo

spring.profiles.active=dev

server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:liquibase-changelog.xml

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=false
spring.jpa.properties.hibernate.query.validate=false

parceo.task.max-retry-count=5
parceo.task.reservation-status-update-task.fixed-delay=60000
parceo.task.process-tasks.fixed-delay=10000
parceo.task.cleanup-task.fixed-delay=300000
parceo.task.cleanup-task.payload-holder-ttl=15m
parceo.task.cleanup-task.failed-task-ttl=30d
